name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*, latest]
        browser: [chrome, firefox]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    -   uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
            version: 12
            run_install: false

    -   name: Get pnpm store directory
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    -   uses: actions/cache@v5
        name: Setup pnpm cache
        with:
            path: ${{ env.STORE_PATH }}
            key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
            restore-keys: |
                ${{ runner.os }}-pnpm-store-

    - name: Build
      run: |
        pnpm install 
        pnpm run build

    - name: Install Firefox for Puppeteer
      if: matrix.browser == 'firefox'
      run: pnpm exec puppeteer browsers install firefox

    - name: Perform Firefox e2e tests
      if: matrix.browser == 'firefox'
      run: pnpm run test:firefox

    - name: Upload Firefox failure screenshots
      if: failure() && matrix.browser == 'firefox'
      uses: actions/upload-artifact@v4
      with:
          name: firefox-e2e-${{ strategy.job-index }}
          path: .cache/firefox-e2e/
          if-no-files-found: ignore

    - name: Install Chrome for Puppeteer
      if: matrix.browser == 'chrome'
      run: pnpm exec puppeteer browsers install chrome --install-deps

    - name: Perform headless Chrome e2e tests
      if: matrix.browser == 'chrome'
      run: pnpm test
